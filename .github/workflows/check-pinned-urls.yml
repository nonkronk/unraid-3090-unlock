name: Weekly firmware-source check

# Runs the real firmware fetcher against the real network, on a schedule,
# so a source going dark (like archive.cachyos.org silently removing the
# pinned package and serving an HTML 200 instead of a 404) is caught before
# a user's install does. This exercises the exact code path
# runtime/prepare-firmware.sh uses at install time -- not a separate probe
# that could drift from it.

"on":
  schedule:
    - cron: "17 6 * * 1" # Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch firmware from a real, live source
        id: fetch
        run: |
          set +e
          python3 runtime/fetch-firmware.py firmware \
            --upstream vendor/zagitta-firmware \
            --out /tmp/firmware-out \
            --work /tmp/firmware-work \
            > /tmp/fetch.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/fetch.log
          exit 0

      - name: Open an issue if every source failed
        if: steps.fetch.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          title="Weekly firmware-source check failed"
          if gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number' | grep -q .; then
            number=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
            gh issue comment "$number" --repo "$REPO" --body-file /tmp/fetch.log
          else
            gh issue create --repo "$REPO" --title "$title" \
              --body "$(printf 'Every firmware source (NVIDIA installer, both mirrors, CachyOS, Arch archive) failed verification in the scheduled check. This means a fresh plugin install will currently fail at the firmware-extraction step.\n\n```\n%s\n```\n\nSee `runtime/fetch-firmware.py` for the source list and `tests/test-firmware-fetch.py` for the verification logic this exercises.' "$(cat /tmp/fetch.log)")"
          fi

      - name: Close any open failure issue now that a source works
        if: steps.fetch.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          title="Weekly firmware-source check failed"
          number=$(gh issue list --repo "$REPO" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$REPO" --body "A source verified successfully again:
          \`\`\`
          $(cat /tmp/fetch.log)
          \`\`\`"
            gh issue close "$number" --repo "$REPO" --reason completed
          fi
